name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: make check
      - name: Build extension bundle
        run: make zip
      - uses: actions/upload-artifact@v7
        with:
          name: qryg-search-extension
          path: qryg-search@ru-dr.shell-extension.zip
          if-no-files-found: error
