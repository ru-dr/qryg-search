name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
      - name: Install dependencies
        run: npm ci
      - name: Check the tag matches the version
        run: python3 scripts/release.py verify "${GITHUB_REF_NAME#v}"
      - name: Check
        run: make check
      - name: Build extension bundle
        run: make zip
      - name: Write release notes
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" qryg-search@ru-dr.shell-extension.zip \
            --title "QryG Search $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
